<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Небольшой сюрприз">
  <title>Для тебя ❤️</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <div class="background-photo-wrapper">
      <img
        class="background-photo"
        src="cake-photo.jpg"
        alt="Торт"
      >
    </div>

    <div class="card">

      <div class="eyebrow">НЕБОЛЬШОЙ СЮРПРИЗ</div>

      <div class="cake">🎂</div>

      <h1>Я приготовил<br>это для тебя.</h1>

      <p class="intro">
        Это доказательство, что я делал его сам 😂.
      </p>


      <!-- ВИДЕО С YOUTUBE -->

      <section class="video-section">
        <iframe
          src="https://www.youtube.com/watch?v=Otp8ZIU1CLQ"
          title="Видео для тебя ❤️"
          allow="accelerometer; autoplay; encrypted-media; picture-in-picture"
          allowfullscreen>
        </iframe>
      </section>


      <p class="footer">Сделано с любовью ❤️</p>

    </div>

  </main>

</body>
</html>
